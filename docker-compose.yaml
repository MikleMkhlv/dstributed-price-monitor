networks:
  dst:
    driver: bridge
    name: dst
    ipam:
      config:
        - subnet: 10.5.0.0/24
services:
  db:
    image: postgres:14
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: monitor_db
    ports:
      - "5432:5432"
    networks:
      dst:
        ipv4_address: 10.5.0.5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: my_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      dst:
        ipv4_address: 10.5.0.2
    environment:
      - REDIS_PASSWORD=my_secure_password
    volumes:
      - redis_data:/data
    command: redis-server --requirepass my_secure_password --appendonly yes

  
  monitor:
    build:
      context: .
      dockerfile: ./cmd/monitor/Dockerfile
    container_name: monitor
    ports:
      - "8081:8081"
    networks:
      dst:
        ipv4_address: 10.5.0.3
    environment:
      APPLICATION_PORT: "8081"
    volumes:
      - ./conf_test.yaml:/app/conf_test.yaml
    depends_on:
      - db
      - redis
  
  fetcher1:
    build:
      context: .
      dockerfile: ./cmd/fetcher/Dockerfile
    container_name: fetcher_1
    ports:
      - "8082:8082"
    networks:
      dst:
        ipv4_address: 10.5.0.6
    environment:
      APPLICATION_PORT: "8082"
    volumes:
      - ./conf_test.yaml:/app/conf_test.yaml



volumes:
  postgres_data:
  redis_data:
